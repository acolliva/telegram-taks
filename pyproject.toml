[project]
name = "taskbot"
version = "0.2.0"
description = "Telegram bot for a shared household to-do list"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot>=22,<23"]

[project.optional-dependencies]
# Italian voice notes transcribed on the Raspberry itself: uv sync --extra voice
voice = ["faster-whisper>=1.0"]

[project.scripts]
taskbot = "taskbot.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
